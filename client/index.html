<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070912" />
    <title>Kenya Quest — Go somewhere. Do something. Make a memory.</title>
    <meta
      name="description"
      content="Small, real adventures across Nairobi. Pick a quest, visit the places, tick off five tasks."
    />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- The catalog API is on another origin; open the connection before the first fetch. -->
    <link rel="preconnect" href="https://kenya-quest-server.onrender.com" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070912'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d4ff3a'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('kenya-quest:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
